<style>
*{box-sizing:border-box}
:root{color-scheme:light;--bg:#F3F6FA;--sf:#FFFFFF;--tx:#14233A;--mu:#37485F;--bd:#D3DCE8;--bi:#66788F;--ac:#1F4F94;--acx:#FFFFFF;--dg:#9E1F17;--hd:#1B2F4B;--hdt:#FFFFFF}
:root[data-theme=dark]{color-scheme:dark;--bg:#0C1522;--sf:#15223A;--tx:#E8EEF7;--mu:#B5C3D6;--bd:#2A3B57;--bi:#70829E;--ac:#8DB4F2;--acx:#0C1522;--dg:#FFA59E;--hd:#070E1A;--hdt:#E8EEF7}
[hidden]{display:none!important}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:grid;min-height:100dvh;grid-template:"h" auto "m" 1fr "n" auto/1fr}
header{grid-area:h;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--hd);color:var(--hdt);border-bottom:1px solid var(--hd)}
h1{font-size:1.25rem;margin:0}
nav{grid-area:n;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 8px;background:none;border:0;border-top:3px solid transparent;color:var(--mu);font:inherit;cursor:pointer}
nav button[aria-current=page]{color:var(--ac);border-top-color:var(--ac);font-weight:600}
main{grid-area:m;padding:16px;max-width:860px;width:100%;margin:0 auto;outline:0}
@media(min-width:769px){#app{grid-template:"n h" auto "n m" 1fr/200px 1fr}nav{flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding-top:8px}nav button{text-align:left;padding:12px 20px;border-top:0;border-left:3px solid transparent}nav button[aria-current=page]{border-left-color:var(--ac)}}
.btn{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bi);background:var(--sf);color:var(--tx);cursor:pointer}
.btn.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.btn.dg{color:var(--dg)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.card{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;box-shadow:0 1px 2px rgba(20,35,58,.06)}
.card .btn{flex:none}
.done .t{text-decoration:line-through;color:var(--mu)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:2px 8px;border:1px solid var(--bd);border-radius:99px;color:var(--mu)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;margin-top:6px}
input[type=checkbox]{width:24px;height:24px;margin-top:2px;flex:none;accent-color:var(--ac)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);padding:20px;width:min(560px,100%)}
dialog::backdrop{background:rgba(0,0,0,.55)}
@media(max-width:560px){dialog{width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0;margin:0}}
label{display:block;font-weight:600;margin:12px 0 4px}
input:not([type=checkbox]),select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--bi);border-radius:8px;background:var(--bg);color:var(--tx)}
input[type=color]{width:56px;padding:2px}
.err{color:var(--dg);font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.mut{color:var(--mu);font-size:.9rem}
.warn{padding:10px 12px;border:1px solid var(--dg);border-radius:8px;color:var(--dg);margin-bottom:12px}
.filters select{flex:1 1 150px;width:auto}.filters .grow{flex:2 1 220px}
.sub label{font-weight:400;margin:0;display:flex;gap:8px;align-items:center}.sub ul{margin-top:6px}summary{cursor:pointer;color:var(--mu);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{margin:0}.kv{font-size:1.6rem;font-weight:700}
.br{display:grid;grid-template-columns:minmax(80px,140px) 1fr 84px;gap:8px;align-items:center;margin:6px 0}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{background:var(--bd);height:10px;border-radius:5px;overflow:hidden;display:block}
.bt i{display:block;height:100%}
.bn{text-align:right;font-size:.85rem;color:var(--mu)}
.chart{display:flex;align-items:flex-end;gap:2px;height:170px;border-bottom:1px solid var(--bd);margin-bottom:22px}
.cb{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.cb i{display:block;width:100%;background:var(--ac);border-radius:3px 3px 0 0;min-height:0;flex-shrink:1}
.cv{font-size:.7rem;color:var(--mu)}
.cx{position:absolute;top:100%;font-size:.65rem;color:var(--mu);white-space:nowrap;margin-top:2px}
main.wide{max-width:1200px}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;align-items:start}
.kc{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;min-height:120px}
.kc.over{outline:2px dashed var(--ac)}
.kc h2{font-size:1rem;margin:4px 4px 8px}
.kc .list{display:grid;gap:8px}
.kcard{cursor:grab;flex-direction:column;gap:6px}
.kcard select{width:auto;padding:4px 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:.8rem;color:var(--mu);padding:4px 0}
.day{min-height:68px;min-width:0;padding:4px;text-align:left;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font:inherit;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.day.dim{opacity:.55}.day.today{border:2px solid var(--ac)}
.day[aria-pressed=true]{background:var(--ac);color:var(--acx)}
.day .n{font-weight:600;font-size:.9rem}
.day .bd{font-size:.72rem;font-weight:700;background:var(--ac);color:var(--acx);border-radius:99px;padding:0 6px;align-self:flex-start}
.day[aria-pressed=true] .bd{background:var(--acx);color:var(--ac)}
.day .ct{font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.day .ct{display:none}.day{min-height:54px}}
.hb{display:flex;gap:8px;flex-wrap:wrap}.chip.od{color:var(--dg);border-color:var(--dg)}
@media(max-width:768px){nav{overflow-x:auto}nav button{flex:1 0 auto;font-size:.85rem;padding:14px 10px;white-space:nowrap}}
@media(max-width:560px){#alt,#imp{height:auto;max-height:90%;margin:auto;border-radius:12px;width:calc(100% - 24px)}}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.phs{border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--bg);display:grid;gap:8px;align-content:start;min-width:0}
.phs textarea{resize:vertical}
@media(max-width:560px){.ph{grid-template-columns:1fr}}
#bgl,#scrim{position:fixed;inset:0;z-index:-2;pointer-events:none}
#bgl{background-size:cover;background-position:center;background-repeat:no-repeat}
#scrim{z-index:-1;background:var(--bg)}
.bgc{display:grid;gap:8px;margin-top:4px}
.sr{position:absolute;left:-9999px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mcard{display:flex;flex-direction:column;gap:10px;text-align:left;padding:14px;background:var(--sf);color:var(--tx);border:1px solid var(--bi);border-radius:12px;box-shadow:0 1px 3px rgba(20,35,58,.12);font:inherit;cursor:pointer;min-width:0}
.mcard:hover,.mcard:focus-visible{border-color:var(--ac);box-shadow:0 4px 12px rgba(20,35,58,.16)}
.mart{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px}
.mart svg{width:100%;height:auto;display:block}
.mt{font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mp{margin:0;color:var(--mu);font-size:.9rem;line-height:1.4}
.mic .o{fill:var(--sf);stroke:var(--ac);stroke-width:3}
.mic .f{fill:var(--ac)}
.mic .k{fill:none;stroke:var(--ac);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.mic .l{fill:none;stroke:var(--mu);stroke-width:3;stroke-linecap:round}
/* >>> notas (E11) */
.nbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.nbar input{flex:1;min-width:180px}
.nsplit{display:grid;gap:12px;align-items:start}
.nlist{display:grid;gap:6px;max-height:36vh;overflow:auto;padding-right:2px}
.nitem{display:grid;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--bi);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit;cursor:pointer;min-width:0}
.nitem.on{border-color:var(--ac);box-shadow:inset 3px 0 0 var(--ac)}
.nt{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm{display:block;font-size:.8rem;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.neditor{display:grid;gap:10px;min-width:0}
.nedtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ntitle{font-size:1.2rem;font-weight:600}
.ntext{min-height:40vh;font:inherit;line-height:1.5;resize:vertical}
.nlink{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(min-width:1024px){.nsplit{grid-template-columns:300px minmax(0,1fr)}.nlist{max-height:72vh}.ntext{min-height:60vh}}
/* <<< notas (E11) */
/* E13: navegação por cartões compactos no topo, sem barra inferior nem lateral; painel de pendências como popover */
#app{grid-template:"h" auto "n" auto "m" 1fr/1fr}
#nav{grid-area:n;display:flex;gap:8px;overflow-x:auto;padding:8px 10px;background:var(--sf);border:0;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:4}
#nav button{flex:0 0 auto;width:88px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:1px solid var(--bi);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit;font-size:.72rem;line-height:1.2;cursor:pointer}
#nav button .mic{width:46px;height:30px}
#nav button[aria-current=page]{border:2px solid var(--ac);background:var(--bg);color:var(--ac);font-weight:600}
#alt{position:fixed;top:64px;right:12px;left:auto;bottom:auto;margin:0;width:min(360px,calc(100% - 24px));max-height:70vh;overflow:auto;height:auto}
@media(min-width:1024px){#app{grid-template:"h" auto "n" auto "m" 1fr/1fr}#nav{padding:10px 32px;gap:10px}#nav button{width:108px}}
/* Desktop (≥1024 px): visual inspirado no Bootstrap, sem CDN (a política de conteúdo e o modo offline impedem carregar arquivos externos). Celular e tablet não recebem estas regras. */
@media(min-width:1024px){
 :root{--bs-radius:.5rem;--bs-radius-sm:.375rem;--bs-shadow:0 .125rem .25rem rgba(0,0,0,.075),0 .5rem 1rem rgba(0,0,0,.04)}
 body{font-size:.95rem;line-height:1.5}
 #app{grid-template:"n h" auto "n m" 1fr/248px 1fr}
 header{padding:.75rem 2rem;background:var(--hd);box-shadow:0 .125rem .25rem rgba(0,0,0,.12);position:sticky;top:0;z-index:5}
 header h1{font-size:1.25rem;font-weight:500;margin:0}
 nav{padding:1rem .75rem;gap:.25rem;background:var(--sf);border-right:1px solid var(--bd);position:sticky;top:57px;height:calc(100dvh - 57px);align-self:start}
 nav button{border:0;border-radius:var(--bs-radius-sm);padding:.5rem .875rem;margin:0;text-align:left;color:var(--tx);font-weight:400;font-size:.95rem}
 nav button:hover{background:var(--bg)}
 nav button[aria-current=page]{background:var(--ac);color:var(--acx);font-weight:500}
 main{max-width:1240px;padding:1.5rem 2rem 2rem}
 main.wide{max-width:1440px}
 h2{font-size:1.2rem;font-weight:500;margin:1.25rem 0 .75rem}
 .btn{padding:.375rem .75rem;border-radius:var(--bs-radius-sm);font-weight:500;font-size:.9rem;line-height:1.5;border:1px solid var(--bi);transition:background-color .15s,color .15s,border-color .15s}
 .btn:hover:not(:disabled){background:var(--bg)}
 .btn:disabled{opacity:.55;cursor:not-allowed}
 .btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acx)}
 .btn.pri:hover:not(:disabled){filter:brightness(.92);background:var(--ac)}
 .btn.dg{color:var(--dg);border-color:var(--dg);background:transparent}
 .btn.dg:hover:not(:disabled){background:var(--dg);color:var(--sf)}
 .card{border:1px solid var(--bd);border-radius:var(--bs-radius);box-shadow:var(--bs-shadow);padding:.875rem 1.125rem;gap:1rem;align-items:center}
 .card .t{font-weight:500}
 .done .t{color:var(--mu)}
 main ul:has(>li.card){grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
 .hoje{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.25rem;align-items:start}
 .hoje ul:has(>li.card){grid-template-columns:1fr}
 .chip{background:var(--bg);border:0;border-radius:var(--bs-radius-sm);font-size:.78rem;font-weight:500;padding:.25rem .55rem;color:var(--tx)}
 .chip.od{background:var(--dg);color:var(--sf);border:0}
 .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
 .kpi{padding:1rem 1.125rem}
 .kv{font-size:1.75rem;font-weight:500}
 .chart{height:260px}
 .day{min-height:96px;border-radius:var(--bs-radius);border-color:var(--bd)}
 .day .n{font-weight:500}
 input:not([type=checkbox]),select,textarea{border-radius:var(--bs-radius-sm);padding:.375rem .75rem;border-color:var(--bi);font-size:.95rem}
 input:not([type=checkbox]):focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 .2rem color-mix(in srgb,var(--ac) 30%,transparent)}
 label{font-weight:500;font-size:.9rem;margin-top:.875rem}
 dialog{border-radius:var(--bs-radius);box-shadow:0 .5rem 1.5rem rgba(0,0,0,.2);width:min(680px,100%);padding:1.5rem}
 .warn{border-radius:var(--bs-radius-sm);padding:.625rem .875rem;background:var(--sf);border-left:4px solid var(--dg)}
 .ph{gap:1rem}
 .mgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
 .phs{border-radius:var(--bs-radius);padding:.875rem;border-color:var(--bd)}
 :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
}
/* >>> E16: acabamento profissional, divisórias e barra lateral responsiva (computador) */
header{border-bottom:1px solid var(--bi);box-shadow:none}
#nav{border-bottom:1px solid var(--bi)}
main section+section{border-top:1px solid var(--bd);padding-top:14px;margin-top:14px}
main ul:has(>li.card)>li.card{border-color:var(--bd);box-shadow:none}
.card{border-radius:8px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.btn{min-height:34px;border-radius:8px;font-weight:500;letter-spacing:.01em}
.chip{border-radius:6px;font-weight:500}
.mcard{border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,.08)}
.mcard:hover{transform:translateY(-1px)}
.mic .o{stroke-width:2.2}
.mic .k{stroke-width:3}
.mic .l{stroke-width:2.2}
.catmk{margin-top:6px}
.catmk summary{cursor:pointer;color:var(--ac);font-weight:500;font-size:.9rem}
.catmk .row{margin-top:8px;align-items:center}
.catmk input[type=color]{width:44px;height:36px;padding:2px}
@media(min-width:1024px){
 #app{grid-template:"h h" auto "n m" 1fr/clamp(180px,19vw,260px) minmax(0,1fr)}
 #nav{flex-direction:column;flex-wrap:nowrap;gap:clamp(6px,1.1vh,12px);padding:clamp(10px,1.4vh,16px) clamp(10px,1vw,14px);overflow:auto;border-right:1px solid var(--bd);border-bottom:0;background:var(--sf);position:sticky;top:57px;height:calc(100dvh - 57px);align-self:start}
 #nav button{width:100%;flex:0 0 auto;padding:clamp(6px,1.2vh,12px) clamp(6px,.8vw,10px);border-radius:10px;font-size:clamp(.78rem,.9vw,.95rem);gap:clamp(2px,.6vh,6px)}
 #nav button .mic{width:clamp(30px,3.2vw,52px);height:auto}

/* Levantamentos: cartões em coluna, uma linha por item */
.lvcard{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:14px 16px}
.lvtitle{font-weight:600;font-size:.95rem;margin-bottom:4px}
.lvrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:.92rem;line-height:1.5;border-bottom:1px solid var(--bd);padding:2px 0}
.lvrow:last-child{border-bottom:0}
.lvrow strong{font-weight:600;font-variant-numeric:tabular-nums}
/* Celular: cartão de tarefa com botões em linha própria, para o título e as etiquetas terem largura */
@media(max-width:768px){
 li.card{flex-wrap:wrap;align-items:flex-start;gap:10px 12px}
 li.card>input[type=checkbox]{flex:none}
 li.card>.grow{flex:1 1 200px;min-width:0}
 li.card>.btn{flex:0 0 auto}
}
/* Aparelhos de toque com tela grande (tablet): navegação em linha no topo, como no celular. A barra lateral fica só para computadores com mouse. */
@media(min-width:1024px) and (pointer:coarse){
 #app{grid-template:"h" auto "n" auto "m" 1fr/1fr}
 #nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;position:sticky;top:0;height:auto;align-self:auto;padding:8px 10px;gap:8px;border-right:0;border-bottom:1px solid var(--bi);background:var(--sf)}
 #nav button{width:auto;flex:0 0 auto;min-width:88px;padding:6px 8px;border-radius:10px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:2px}
 #nav button .mic{width:46px;height:30px}
}
/* Caneta (E22/E24): folhas pautadas, barra de ferramentas e área de desenho */
.ruled{position:relative;border:1px solid var(--bi);border-radius:8px;min-height:360px;max-height:70vh;overflow:auto;background-color:var(--sf);background-image:linear-gradient(to bottom,transparent 39px,var(--bd) 39px),linear-gradient(to right,transparent 56px,#d9534f 56px,#d9534f 57px,transparent 57px);background-size:100% 40px,100% 100%;background-position:0 0,0 0;background-repeat:repeat,no-repeat}
.inkcv{display:block;width:100%;height:600px;touch-action:none;cursor:crosshair}
.inkbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}

<script>
(()=>{

const validDate=s=>{if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const[y,m,d]=s.split('-').map(Number);if(y<1900||y>2999)return false;const t=new Date(Date.UTC(y,m-1,d));return t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d};
const fmt=s=>s?s.split('-').reverse().join('/'):'';

const addD=(s,n)=>{const[y,m,d]=s.split('-').map(Number),t=new Date(Date.UTC(y,m-1,d+n));return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate())};

function nextDate(r,C,P){
 const B=C>P?C:P;
 if(r.type==='daily')return addD(B,1);

 if(r.type==='weekly'){for(let i=1;i<=7;i++){const x=addD(B,i);if(r.weekdays.includes(dow(x)))return x}}

 for(let k=0;k<30;k++){const c=r.type==='monthly'?mdate(y,m,r.monthDay):mdate(y,r.month,r.day);if(c>B)return c;if(r.type==='monthly'){m++;if(m>12){m=1;y++}}else y++}}

 for(const t of L){if(t.deletedAt||t.status==='done'||!t.dueDate)continue;if(t.dueDate<td)o.push(t);else if(t.dueDate===td)a.push(t);else if(t.dueDate<=lim)n.push(t)}

/* Fotos antes/depois (RF17–RF21, RN14–RN15, RN17–RN18) */
const PH_MAX=500*1024;
async function compressImage(file,opt={}){

 if(!file||!/^image\/(jpeg|png|webp)$/i.test(file.type||''))throw new Error('Formato não suportado. Use JPEG, PNG ou WebP.');
 if(file.size>25*1048576)throw new Error('Arquivo original acima de 25 MB.');
 let bmp;try{bmp=await createImageBitmap(file)}catch(e){throw new Error('Não foi possível ler esta imagem.')}
 const k=Math.min(1,MS/Math.max(bmp.width,bmp.height)),w=Math.max(1,Math.round(bmp.width*k)),hh=Math.max(1,Math.round(bmp.height*k));
 const c=document.createElement('canvas');c.width=w;c.height=hh;const cx=c.getContext('2d');cx.fillStyle='#ffffff';cx.fillRect(0,0,w,hh);cx.drawImage(bmp,0,0,w,hh);if(bmp.close)bmp.close();

 function openLinesConvert(note){

  else{
   let cur={...n,ink:(n.ink||[]).map(st=>({...st,p:st.p.map(p=>[...p])}))},timer=null;
   const st=h('span',{class:'mut',role:'status'},'Salvo');

   const persist=()=>guard(async()=>{const r=await saveNote({...cur,title:t.value});if(!r.ok){st.textContent='Não salvo';say(Object.values(r.errors)[0]);return}cur=r.note;st.textContent='Salvo';drawList()});

   const link=lt?h('div',{class:'nlink'},h('span',{class:'chip'},'Tarefa: '+lt.title+' · '+(lt.status==='done'?'concluída':'aberta')),h('button',{class:'btn',type:'button',onclick:()=>openTask(lt)},'Ver tarefa'))
    :n.taskId?h('div',{class:'nlink'},h('span',{class:'chip'},'Tarefa vinculada foi excluída; o texto da nota foi mantido.')):null;
   const delBtn=h('button',{class:'btn dg',type:'button',onclick:()=>{if(!confirm('Mover esta nota para a lixeira? Ela fica disponível por '+trashDays()+' dias.'))return;clearTimeout(timer);guard(async()=>{await setNoteDeleted(cur,true);S.nsel=null;render();say('Nota movida para a lixeira.')})}},'Excluir nota');
   if(mode==='texto'){
    const x=h('textarea',{class:'ntext','aria-label':'Texto da nota',maxlength:'20000',placeholder:'Escreva aqui…'});x.value=n.text||'';
    x.addEventListener('input',()=>{cur={...cur,text:x.value};schedule()});

    if(!lt&&!n.taskId&&(x.value||'').includes('\n'))acts.push(h('button',{class:'btn',type:'button',onclick:()=>{clearTimeout(timer);guard(async()=>{const r=await saveNote({...cur,title:t.value,text:x.value});if(!r.ok){say(Object.values(r.errors)[0]);return}cur=r.note;openLinesConvert(r.note)})}},'Uma tarefa por linha'));
    ed.append(h('div',{class:'nedtop'},st,modeBtn,delBtn));
    if(link)ed.append(link);else if(acts.length)ed.append(h('div',{class:'nlink'},...acts));
    ed.append(t,x);
   }else{
    /* Modo caneta: traços vetoriais com pressão; dedo não desenha (rolagem). */
    const wrap=h('div',{class:'ruled'});
    const cv=h('canvas',{class:'inkcv','aria-label':'Área de desenho à caneta'});
    wrap.append(cv);
    let tool='pen',drawing=null,undoS=[],redoS=[];
    const clone=v=>v.map(st=>({...st,p:st.p.map(p=>[...p])}));
    const draw=()=>{const ctx=cv.getContext('2d');if(!ctx)return;const cssW=cv.clientWidth||600,cssH=Math.max(360,(cv.clientHeight||360));
     const dpr=(typeof devicePixelRatio==='number'&&devicePixelRatio>0)?devicePixelRatio:1,unit=cssW/INK_UNIT;
     cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);ctx.setTransform(dpr*unit,0,0,dpr*unit,0,0);ctx.clearRect(0,0,INK_UNIT,cssH/unit);
     ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1f4f94';
     for(const st of cur.ink){for(let i=1;i<st.p.length;i++){const a=st.p[i-1],b=st.p[i];ctx.lineWidth=st.w*(0.4+((a[2]+b[2])/2)*1.2);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}}};
    const save=()=>{st.textContent='Salvando…';clearTimeout(timer);timer=setTimeout(persist,500)};
    const snap=()=>{undoS.push(clone(cur.ink));if(undoS.length>60)undoS.shift();redoS=[]};
    const pt=e=>{const r=cv.getBoundingClientRect(),unit=INK_UNIT/(r.width||INK_UNIT);return[Math.max(0,Math.min(INK_UNIT,(e.clientX-r.left)*unit)),Math.max(0,(e.clientY-r.top)*unit),(e.pressure>0?e.pressure:0.5)]};
    const eraseAt=(x,y)=>{const before=cur.ink.length;cur={...cur,ink:cur.ink.filter(st=>!st.p.some(p=>Math.hypot(p[0]-x,p[1]-y)<14))};return cur.ink.length!==before};
    cv.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;e.preventDefault();cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);const[x,y,pr]=pt(e);snap();
      if(tool==='eraser'){eraseAt(x,y);draw();return}
      drawing={w:3,p:[[x,y,pr]]};cur={...cur,ink:[...cur.ink,drawing]};draw()});
    cv.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!drawing&&tool!=='eraser')return;const[x,y,pr]=pt(e);
      if(tool==='eraser'){if(e.buttons&&eraseAt(x,y)){draw()}return}
      if(drawing){drawing.p.push([x,y,pr]);draw()}});
    const end=e=>{if(drawing){drawing=null;save()}else if(tool==='eraser'){save()}};
    cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
    const bar=h('div',{class:'inkbar'},
     h('button',{class:'btn'+(tool==='pen'?' pri':''),type:'button',onclick:()=>{tool='pen';render()}},'Caneta'),
     h('button',{class:'btn'+(tool==='eraser'?' pri':''),type:'button',onclick:()=>{tool='eraser';render()}},'Borracha'),
     h('button',{class:'btn',type:'button',disabled:!undoS.length,onclick:()=>{if(!undoS.length)return;redoS.push(clone(cur.ink));cur={...cur,ink:undoS.pop()};draw();save()}},'Desfazer'),
     h('button',{class:'btn',type:'button',disabled:!redoS.length,onclick:()=>{if(!redoS.length)return;undoS.push(clone(cur.ink));cur={...cur,ink:redoS.pop()};draw();save()}},'Refazer'),
     h('button',{class:'btn dg',type:'button',disabled:!cur.ink.length,onclick:()=>{if(!cur.ink.length||!confirm('Apagar todo o desenho desta nota?'))return;snap();cur={...cur,ink:[]};draw();save()}},'Limpar'),
     h('button',{class:'btn',type:'button',disabled:!cur.ink.length,onclick:()=>{clearTimeout(timer);guard(async()=>{const r=await saveNote({...cur,title:t.value});if(!r.ok){say(Object.values(r.errors)[0]);return}cur=r.note;let img;try{img=await inkToImage(cur.ink)}catch(e){say(e.message);alert(e.message);return}openConvert(r.note,{att:{kind:'photo',mime:img.mime,name:'desenho.jpg',size:img.size,blob:img.blob}})})}},'Virar tarefa (desenho)'));
    ed.append(h('div',{class:'nedtop'},st,modeBtn,delBtn));
    if(link)ed.append(link);
    ed.append(t,bar,wrap);
    setTimeout(draw,0);
   }
  }
  return h('div',{},h('div',{class:'nbar'},q,h('button',{class:'btn pri',type:'button',onclick:()=>newNoteNow()},'+ Nova nota (Ctrl+N)')),h('div',{class:'nsplit'},list,ed))}

   const r=await saveTask({title,notes:ex.value,priority:+pr.value,status:'todo',dueDate:du.value||null,categoryId:ca.value||null,tags:[],subtasks:[],recurrence:null,noteId:note.id});
   if(!r.ok){err.textContent=Object.values(r.errors)[0];return}
   try{await commitAtt(r.task.id,att)}catch(e){err.textContent=e.message;return}
   const nr={...note,taskId:r.task.id};await Store.put('notes',nr);S.notes=S.notes.map(x=>x.id===nr.id?nr:x);
